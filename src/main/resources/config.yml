# NexusAchievements configuration.
#
# The core idea: real milestones from across the whole Nexus plugin family, popped up as a toast
# styled to look like a real Minecraft advancement -- title flash with vanilla's own real header
# wording, vanilla's own real toast sound, a formatted chat card -- without this plugin ever
# actually touching the real advancement engine (see ToastService's own doc comment for why that
# was a deliberate choice, not a limitation this plugin ran into by accident).
#
# Every achievement below has a `trigger-type`:
#   VANILLA -- hard-wired in VanillaMilestoneListener against real, certain vanilla events. Always live.
#   COMMAND -- fires the moment a player types the exact command in `trigger-value`. Always live,
#              tunable right here without recompiling anything.
#   CONSUME -- fires when a player eats/drinks an item whose display name contains any of the
#              comma-separated substrings in `trigger-value`. Always live, tunable here.
#   API     -- nothing in this plugin fires it yet. It's fully defined and ready -- it just needs
#              one line (NexusAchievementsApi.grant(player, "<id>")) dropped into that source
#              plugin's own real code. See this plugin's README for the full list of which
#              achievements are which, and why.
#
# A malformed entry (unknown icon/frame/trigger-type, missing id/title) is skipped individually
# with a logged warning -- never fatal to the rest of the list, same defensive stance every config
# parser in this plugin family takes.

toast:
  title-fade-in-ticks: 10
  title-stay-ticks: 70
  title-fade-out-ticks: 20
  play-sound: true
  # CHALLENGE-tier achievements (the rarest, purple-frame ones) also get announced to the whole
  # server in chat -- "amplify the feeling of being rewarded" without spamming chat for every
  # single ordinary TASK achievement too.
  broadcast-challenge-tier: true

